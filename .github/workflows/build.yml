name: 🎬 VIP Diziler — APK & AAB Build

on:
  # Her main/master push'unda otomatik çalış
  push:
    branches: [ main, master ]
  # Pull request'lerde test build
  pull_request:
    branches: [ main, master ]
  # Manuel tetikleme (GitHub UI'dan "Run workflow" butonu)
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build tipi seç'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
          - both

# Aynı anda sadece 1 build çalışsın
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────
  # JOB 1: Debug APK (imzasız, test için)
  # ─────────────────────────────────────────────────────────────
  build-debug:
    name: 🔧 Debug APK
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || inputs.build_type == 'debug' || inputs.build_type == 'both'

    steps:
      - name: 📥 Kodu indir
        uses: actions/checkout@v4

      - name: ☕ Java 17 kur
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 🔑 Gradle izinleri ver
        run: chmod +x gradlew

      - name: 🏗️ Debug APK derle
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: 📤 Debug APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: VipDiziler-Debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

  # ─────────────────────────────────────────────────────────────
  # JOB 2: Release APK + AAB (imzalı, Play Store için)
  # ─────────────────────────────────────────────────────────────
  build-release:
    name: 🚀 Release APK + AAB
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') ||
      github.event_name == 'workflow_dispatch' && (inputs.build_type == 'release' || inputs.build_type == 'both')

    steps:
      - name: 📥 Kodu indir
        uses: actions/checkout@v4

      - name: ☕ Java 17 kur
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 🔑 Gradle izinleri ver
        run: chmod +x gradlew

      # Keystore'u GitHub Secret'tan oluştur
      - name: 🔐 Keystore dosyasını hazırla
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/vipdiziler-keystore.jks
          echo "✅ Keystore hazır: $(ls -la app/vipdiziler-keystore.jks)"

      # google-services.json'ı secret'tan oluştur (Firebase için)
      - name: 🔥 google-services.json hazırla
        if: ${{ secrets.GOOGLE_SERVICES_JSON != '' }}
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON }}" > app/google-services.json
          echo "✅ google-services.json hazır"

      # Eğer google-services.json yoksa Firebase bağımlılıklarını devre dışı bırak
      - name: 🔥 Firebase yoksa build.gradle'ı güncelle
        if: ${{ secrets.GOOGLE_SERVICES_JSON == '' }}
        run: |
          sed -i "s/id 'com.google.gms.google-services'//g" app/build.gradle
          sed -i "s/id 'com.google.firebase.crashlytics'//g" app/build.gradle
          sed -i "/firebase/d" app/build.gradle
          echo "⚠️ Firebase devre dışı (secret bulunamadı)"

      - name: 🏗️ Release APK derle
        env:
          KEYSTORE_PATH: vipdiziler-keystore.jks
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$KEYSTORE_PATH \
            -Pandroid.injected.signing.store.password=$STORE_PASSWORD \
            -Pandroid.injected.signing.key.alias=$KEY_ALIAS \
            -Pandroid.injected.signing.key.password=$KEY_PASSWORD \
            --stacktrace --no-daemon

      - name: 📦 AAB derle (Play Store için)
        env:
          KEYSTORE_PATH: vipdiziler-keystore.jks
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=$KEYSTORE_PATH \
            -Pandroid.injected.signing.store.password=$STORE_PASSWORD \
            -Pandroid.injected.signing.key.alias=$KEY_ALIAS \
            -Pandroid.injected.signing.key.password=$KEY_PASSWORD \
            --stacktrace --no-daemon

      # APK boyutunu ve bilgilerini göster
      - name: 📊 Build bilgileri
        run: |
          echo "═══════════════════════════════════"
          echo "  VIP Diziler Build Sonucu"
          echo "═══════════════════════════════════"
          echo "APK Boyutu:"
          du -sh app/build/outputs/apk/release/*.apk
          echo ""
          echo "AAB Boyutu:"
          du -sh app/build/outputs/bundle/release/*.aab
          echo "═══════════════════════════════════"

      - name: 📤 Release APK yükle
        uses: actions/upload-artifact@v4
        with:
          name: VipDiziler-Release-APK-v${{ github.run_number }}
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: 📤 Release AAB yükle
        uses: actions/upload-artifact@v4
        with:
          name: VipDiziler-Release-AAB-v${{ github.run_number }}
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 30

      # Keystore'u temizle (güvenlik)
      - name: 🧹 Keystore dosyasını sil
        if: always()
        run: rm -f app/vipdiziler-keystore.jks

  # ─────────────────────────────────────────────────────────────
  # JOB 3: GitHub Release oluştur (sadece tag push'larında)
  # ─────────────────────────────────────────────────────────────
  create-release:
    name: 🏷️ GitHub Release oluştur
    runs-on: ubuntu-latest
    needs: build-release
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: 📥 Artifact'ları indir
        uses: actions/download-artifact@v4
        with:
          pattern: VipDiziler-Release-*
          merge-multiple: true

      - name: 🏷️ Release oluştur
        uses: softprops/action-gh-release@v1
        with:
          name: VIP Diziler ${{ github.ref_name }}
          body: |
            ## 🎬 VIP Diziler ${{ github.ref_name }}

            ### İndirme
            - **APK** → Direkt cihaza yüklemek için
            - **AAB** → Google Play Store'a yüklemek için

            ### Değişiklikler
            - Bu sürümdeki değişiklikler burada belirtilir.
          files: |
            *.apk
            *.aab
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
